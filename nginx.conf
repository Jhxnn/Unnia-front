server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # a API fica atrás do mesmo endereço do site, então o navegador não precisa de CORS
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # canal de tempo real (SSE): sem buffer e com leitura longa, senão o nginx segura os avisos
    location = /api/stream {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
    }

    # arquivos com hash no nome nunca mudam: podem ficar em cache por um ano
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # o index.html nunca é guardado, para que uma versão nova apareça no próximo acesso
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # as rotas do app (/eventos/123, /admin...) são resolvidas no navegador
    location / {
        try_files $uri $uri/ /index.html;
    }
}
